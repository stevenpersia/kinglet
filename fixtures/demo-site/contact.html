<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Maison Sable</title>
  <meta name="description" content="Écrire à l’atelier Maison Sable.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><a href="/"><strong>Maison Sable</strong></a><span class="nav"><a href="/contact.html#avis">Avis</a> · <a href="/contact.html#nulle-part">Plan</a></span></header>
  <main>
    <p class="kicker">Site de démonstration Kinglet</p>
    <h1 id="headline">Contact</h1>
    <!-- Deliberately imperfect: the e-mail field brings up the plain keyboard and checks nothing, the name has no autocomplete. -->
    <form id="contact" novalidate>
      <p><label for="nom">Nom</label><br><input id="nom" name="nom"></p>
      <p><label for="email">E-mail</label><br><input id="email" name="email" type="text"></p>
      <p><label for="tel">Téléphone</label><br><input id="tel" name="tel" type="tel" autocomplete="tel"></p>
      <p><label for="cp">Code postal</label><br><input id="cp" name="cp" inputmode="numeric" autocomplete="postal-code" pattern="[0-9]{5}" required></p>
      <p><label for="message">Message</label><br><textarea id="message" name="message"></textarea></p>
      <p><label><input type="checkbox" name="rgpd" required> J’accepte d’être recontacté</label></p>
      <p><button type="submit">Envoyer</button></p>
    </form>
  </main>
  <!-- The page's own world counts what it sees: input events (automatic filling), and the visual viewport (on-screen keyboard). -->
  <script>
    window.kinglet_inputs = 0;
    window.kinglet_vv = 0;
    document.addEventListener('input', () => window.kinglet_inputs++);
    window.visualViewport.addEventListener('resize', () => window.kinglet_vv++);
    // An anchor that only exists after JavaScript: the site audit must not report it.
    document.querySelector('main').insertAdjacentHTML('beforeend', '<section id="avis"><h2>Avis</h2></section>');
  </script>
</body>
</html>
