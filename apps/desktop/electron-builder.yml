appId: dev.kinglet.app
productName: Kinglet
executableName: kinglet
artifactName: ${productName}-${version}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
# Everything the app needs is bundled by electron-vite into out/.
files:
  - out/**
  - package.json
  - build/icon.png
asar: true
npmRebuild: false
linux:
  target:
    - AppImage
    - pacman
  category: Development
  syncDesktopName: true
  icon: build/icon.png
  synopsis: Voir son site sur tous les écrans
  description: Aperçu multi-appareils, balises de partage et checks pour les sites construits avec Claude.
  maintainer: Steven Persia
  desktop:
    entry:
      StartupWMClass: kinglet
      Keywords: preview;responsive;mobile;opengraph;
# Releases (and updates) come from GitHub Releases of this repository.
publish:
  provider: github
  owner: stevenpersia
  repo: parakeet
  releaseType: release
pacman:
  packageName: kinglet
  # electron-builder's defaults name packages that are gone from Arch (http-parser, libappindicator-gtk3…).
  depends:
    - gtk3
    - nss
    - alsa-lib
    - libxss
    - libxtst
    - libnotify
    - xdg-utils
    - at-spi2-core
    - libdrm
    - mesa
