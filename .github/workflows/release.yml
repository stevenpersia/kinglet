name: Release

# Publish the version in apps/desktop/package.json, either way:
#   - push a matching tag:  git tag v0.1.0 && git push origin v0.1.0
#   - or Actions → Release → Run workflow (the tag is created from the version)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release and upload its files

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # latest-linux.yml in this repository's releases is what the app's updater reads.
      - name: Version to release
        run: |
          tag="v$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, but apps/desktop/package.json says $tag" >&2
            exit 1
          fi
          # Complete only with latest-linux.yml: a release left half-made (GitHub error) is finished by this run.
          if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx latest-linux.yml; then
            echo "Release $tag already exists: bump the version in apps/desktop/package.json" >&2
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick libarchive-tools
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Electron and the AppImage/pacman tools, downloaded once instead of on every release.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The full scenario runs once, on the packaged app below (CI also ran it on the dev build of this commit).

      - name: Build AppImage + pacman
        working-directory: apps/desktop
        run: pnpm exec electron-vite build && pnpm exec electron-builder --linux --publish never

      # Test the packaged app (update check included) before anything is published.
      - name: Acceptance test (packaged app)
        working-directory: apps/desktop
        # Without captures: nobody looks at them here (CI keeps them), and they cost about 30 s.
        run: KINGLET_SELFTEST_SHOTS=0 KINGLET_BIN=dist/linux-unpacked/kinglet node scripts/selftest.mjs

      # Release in this repository (tag on the code, notes from the commits).
      - name: Publish the release
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # GitHub answers 502 now and then: retry, and finish a release a failed attempt left behind.
        # --target creates the tag on this commit when it does not exist yet (manual run).
        # latest-linux.yml goes last, so the updater never sees a version whose files are missing.
        run: |
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "Attempt $i failed, retrying" >&2; sleep $((i * 10)); done; return 1; }
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            retry sh -c 'gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Kinglet ${TAG#v}" --generate-notes'
          fi
          retry gh release upload "$TAG" dist/*.AppImage dist/*.pacman --clobber
          retry gh release upload "$TAG" dist/latest-linux.yml --clobber
          retry gh release edit "$TAG" --draft=false --latest >/dev/null
