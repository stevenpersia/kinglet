name: Release

# Publish the version in apps/desktop/package.json, either way:
#   - push a matching tag:  git tag v0.1.0 && git push origin v0.1.0
#   - or Actions → Release → Run workflow (the tag is created from the version)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  RELEASES_REPO: stevenpersia/kinglet-releases

permissions:
  contents: write # create the release and upload its files

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # The code stays private; updates are read from a public repository holding only the releases.
      - name: Version to release
        run: |
          tag="v$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, but apps/desktop/package.json says $tag" >&2
            exit 1
          fi
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "Secret RELEASES_TOKEN missing: a token with Contents read & write on $RELEASES_REPO" >&2
            exit 1
          fi
          # Complete only with latest-linux.yml: a release left half-made (GitHub error) is finished by this run.
          if GH_TOKEN="$RELEASES_TOKEN" gh release view "$tag" --repo "$RELEASES_REPO" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx latest-linux.yml; then
            echo "Release $tag already exists: bump the version in apps/desktop/package.json" >&2
            exit 1
          fi
          # Already released here (before the public repository existed): only publish it there.
          if gh release view "$tag" >/dev/null 2>&1; then echo "PRIVATE_DONE=1" >> "$GITHUB_ENV"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick libarchive-tools
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm selftest

      - name: Build AppImage + pacman
        working-directory: apps/desktop
        run: pnpm exec electron-vite build && pnpm exec electron-builder --linux --publish never

      # Test the packaged app (update check included) before anything is published.
      - name: Acceptance test (packaged app)
        working-directory: apps/desktop
        run: KINGLET_BIN=dist/linux-unpacked/kinglet node scripts/selftest.mjs

      # Release in this repository (tag on the code, notes from the commits).
      - name: Publish the release
        if: env.PRIVATE_DONE != '1'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --target creates the tag on this commit when it does not exist yet (manual run).
        run: gh release create "$TAG" dist/*.AppImage dist/*.pacman dist/latest-linux.yml --target "$GITHUB_SHA" --title "Kinglet ${TAG#v}" --generate-notes

      # Same files in the public repository: latest-linux.yml there is what the app's updater reads.
      - name: Publish the update
        working-directory: apps/desktop
        # GitHub answers 502 now and then: retry, and finish a release a failed attempt left behind.
        # latest-linux.yml goes last, so the updater never sees a version whose files are missing.
        run: |
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "Attempt $i failed, retrying" >&2; sleep $((i * 10)); done; return 1; }
          GH_TOKEN="$PRIVATE_TOKEN" gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          # A release needs a commit to tag: give an empty repository its README.
          if ! gh api "repos/$RELEASES_REPO/commits?per_page=1" >/dev/null 2>&1; then
            printf '# Kinglet releases\n\nBuilds of Kinglet for Linux (AppImage, pacman). The app updates itself from here.\n' > README.md
            retry gh api -X PUT "repos/$RELEASES_REPO/contents/README.md" -f message="README" -f content="$(base64 -w0 README.md)" >/dev/null
          fi
          if ! gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            retry sh -c 'gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$RELEASES_REPO" --title "Kinglet ${TAG#v}" --notes-file notes.md'
          fi
          retry gh release upload "$TAG" dist/*.AppImage dist/*.pacman --repo "$RELEASES_REPO" --clobber
          retry gh release upload "$TAG" dist/latest-linux.yml --repo "$RELEASES_REPO" --clobber
          # A release made while the repository was empty stays a draft: publish it.
          retry gh release edit "$TAG" --repo "$RELEASES_REPO" --draft=false --latest >/dev/null
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PRIVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
