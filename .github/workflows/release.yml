name: Release

# Push a tag matching the app version to publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload its files

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: The tag must match the app version
        run: |
          version="v$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, but apps/desktop/package.json says $version" >&2
            exit 1
          fi

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick libarchive-tools
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm selftest

      - name: Build AppImage + pacman
        working-directory: apps/desktop
        run: pnpm exec electron-vite build && pnpm exec electron-builder --linux --publish never

      # Test the packaged app (update check included) before anything is published.
      - name: Acceptance test (packaged app)
        working-directory: apps/desktop
        run: PARAKEET_BIN=dist/linux-unpacked/parakeet node scripts/selftest.mjs

      # latest-linux.yml is what the app's updater reads.
      - name: Publish the release
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.AppImage dist/*.pacman dist/latest-linux.yml --title "Parakeet ${GITHUB_REF_NAME#v}" --generate-notes
