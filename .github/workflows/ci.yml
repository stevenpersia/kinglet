name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: System packages (virtual display, screenshots, pacman packaging)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick libarchive-tools
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox relies on.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # Without captures here: the packaged run below takes them (it clears selftest-output/ first).
      - name: Acceptance test (dev build)
        run: KINGLET_SELFTEST_SHOTS=0 pnpm selftest

      - name: Package AppImage + pacman
        run: pnpm dist

      - name: Acceptance test (packaged app)
        working-directory: apps/desktop
        run: KINGLET_BIN=dist/linux-unpacked/kinglet node scripts/selftest.mjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selftest-screenshots
          path: apps/desktop/selftest-output/*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: kinglet-linux
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.pacman
