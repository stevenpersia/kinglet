name: CI

# Actions minutes are counted (private repository): each change is built once per push to a PR and once on main,
# never twice. Branches without a PR (ccr-*, claude/*, work in progress) are not built until a PR is opened.
on:
  push:
    branches: [main]
  pull_request:

# A new push on the same branch or PR cancels the run still going (its result would be outdated anyway).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: System packages (virtual display, screenshots, pacman packaging)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick libarchive-tools
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox relies on.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # On main, without captures here: the packaged run below takes them (it clears selftest-output/ first).
      # On a PR, this is the only run, so it takes them.
      - name: Acceptance test (dev build)
        run: KINGLET_SELFTEST_SHOTS=${{ github.event_name == 'push' && '0' || '1' }} pnpm selftest

      # Packaging and its acceptance test, the slowest part: on main only (release.yml does both again before
      # publishing). A PR is checked on the dev build above.
      - name: Package AppImage + pacman
        if: github.event_name == 'push'
        run: pnpm dist

      - name: Acceptance test (packaged app)
        if: github.event_name == 'push'
        working-directory: apps/desktop
        run: KINGLET_BIN=dist/linux-unpacked/kinglet node scripts/selftest.mjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selftest-screenshots
          path: apps/desktop/selftest-output/*.png
          if-no-files-found: ignore
          retention-days: 7

      # Storage is counted too: the build of main is kept 3 days (releases are kept in GitHub Releases).
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: kinglet-linux
          retention-days: 3
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.pacman
